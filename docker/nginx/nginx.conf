# Replace `bounce.example.com` with the real domain everywhere below.
#
# Deploy order (see docs/GO_LIVE.md step 7):
#   1. Deploy with only the HTTP `server` block active (as committed) so
#      `docker compose up -d` has something listening on :80 for Certbot's
#      HTTP-01 challenge to reach.
#   2. Issue the certificate with Certbot in webroot mode against
#      /var/www/certbot (docs/GO_LIVE.md has the exact command).
#   3. Uncomment the HTTPS `server` block below, then replace the plain
#      `location /ws` and `location /` blocks in the HTTP block with a
#      redirect to HTTPS (keep the acme-challenge location as-is, for
#      cert renewal) — see the commented example at the bottom.
#   4. `docker compose restart nginx`

server {
    listen 80;
    server_name bounce.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /ws {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

