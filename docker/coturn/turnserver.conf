# Minimal coturn config for Bounce's TURN relay fallback (docs/FSD.md §1).
# Replace the placeholders before deploying — this is not production-ready
# as committed.

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
user=bounce:CHANGE_ME_TURN_PASSWORD
realm=bounce.example.com
total-quota=100
stale-nonce=600
no-multicast-peers
# Set to your VPS's public IP so clients behind NAT get a reachable relay:
# external-ip=YOUR.SERVER.PUBLIC.IP
