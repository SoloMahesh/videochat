<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Video Chat</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-database.js"></script>

    <style>
        /* General Styling */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1E2A78, #4C85E3);
            color: white;
            text-align: center;
            padding: 40px;
        }

        h1 { font-size: 2.5rem; margin-bottom: 20px; }

        .video-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }

        video {
            width: 45%;
            max-width: 400px;
            height: auto;
            border: 5px solid white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        video:hover { transform: scale(1.05); }

        .button-container { margin-top: 20px; }

        button {
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
            background: #ff5757;
            color: white;
            border: none;
            border-radius: 50px;
            transition: all 0.3s;
        }

        button:hover { background: #ff2e2e; }

        button:disabled { background: gray; cursor: not-allowed; }

        #loading {
            font-size: 20px;
            margin-top: 15px;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Toast Message Styles */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 16px;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            visibility: hidden;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease-in-out;
        }
    </style>
</head>
<body>

    <h1>🔹 Random Video Chat 🔹</h1>

    <div class="video-container">
        <video id="localVideo" autoplay muted></video>
        <video id="remoteVideo" autoplay></video>
    </div>

    <div class="button-container">
        <button id="startButton" onclick="startChat()">Start Chat 🚀</button>
        <button id="endButton" onclick="endChat()" disabled>End Chat ❌</button>
    </div>

    <p id="loading">Waiting for a partner...</p>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // Firebase config (Replace with your Firebase project credentials)
        const firebaseConfig = {
            apiKey: "AIzaSyBO3Uk37o03i6oqQYy0EuBsvabeAqOyXdo",
            authDomain: "random-video-chat-dec63.firebaseapp.com",
            databaseURL: "https://random-video-chat-dec63-default-rtdb.firebaseio.com",
            projectId: "random-video-chat-dec63",
            storageBucket: "random-video-chat-dec63.firebasestorage.app",
            messagingSenderId: "35386896936",
            appId: "1:35386896936:web:206035c65dfb1177c3bb1d"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let localStream;
        let peerConnection;
        let roomId;
        const iceServers = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

        async function startChat() {
            document.getElementById('startButton').disabled = true;
            document.getElementById('loading').innerText = "Searching for a partner...";

            try {
                // Request camera & microphone access
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;

                // Proceed to find or create room
                findOrCreateRoom();
            } catch (err) {
                console.error("Camera/Microphone access denied:", err);
                alert("⚠️ Please allow access to the camera and microphone in your browser settings.");
            }
        }

        function findOrCreateRoom() {
            const roomRef = database.ref("rooms");

            roomRef.once("value", async (snapshot) => {
                const rooms = snapshot.val();
                let availableRoom = null;

                if (rooms) {
                    Object.keys(rooms).forEach((key) => {
                        if (!rooms[key].connected) {
                            availableRoom = key;
                        }
                    });
                }

                if (availableRoom) {
                    roomId = availableRoom;
                    database.ref("rooms/" + roomId).update({ connected: true });
                    startCall(false);
                } else {
                    roomId = database.ref("rooms").push({ connected: false }).key;
                    startCall(true);
                }
            });
        }

        async function startCall(isCaller) {
            peerConnection = new RTCPeerConnection(iceServers);
            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    database.ref(`rooms/${roomId}/iceCandidates`).push(event.candidate);
                }
            };

            peerConnection.ontrack = event => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
                document.getElementById('loading').innerText = "Connected to a partner!";
                showToast("Connected to a partner! 🎉");
            };

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            if (isCaller) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                database.ref(`rooms/${roomId}`).update({ offer });
            } else {
                database.ref(`rooms/${roomId}/offer`).once("value", async snapshot => {
                    if (snapshot.exists()) {
                        const offer = snapshot.val();
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        database.ref(`rooms/${roomId}`).update({ answer });
                    }
                });
            }

            database.ref(`rooms/${roomId}/answer`).on("value", async snapshot => {
                if (snapshot.exists() && peerConnection.signalingState === "have-local-offer") {
                    const answer = snapshot.val();
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                }
            });

            database.ref(`rooms/${roomId}/iceCandidates`).on("child_added", snapshot => {
                const candidate = new RTCIceCandidate(snapshot.val());
                peerConnection.addIceCandidate(candidate);
            });

            document.getElementById("endButton").disabled = false;
            showToast("Connection established! 🟢");
        }

        function endChat() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (roomId) {
                database.ref(`rooms/${roomId}`).remove();
            }

            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('startButton').disabled = false;
            document.getElementById('endButton').disabled = true;
            document.getElementById('loading').innerText = "Chat ended.";
            showToast("Chat ended! ❌");
        }

        function showToast(message) {
            const toast = document.createElement("div");
            toast.classList.add("toast");
            toast.innerText = message;

            const toastContainer = document.getElementById("toast-container");
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.classList.add("show");
            }, 100);

            setTimeout(() => {
                toast.classList.remove("show");
                setTimeout(() => toastContainer.removeChild(toast), 500);
            }, 3000);
        }
    </script>

</body>
</html>
